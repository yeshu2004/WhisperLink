services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend
    ports: 
      - 8080:80
    depends_on:
      - backend
    networks:
      - app-network
  
volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge